<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fish Arena Online</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      overflow: hidden;
      background-color: #0b0d10;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    canvas#gameCanvas {
      display: block;
    }

    /* --- OVERLAY CONTAINER --- */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10;
    }

    #ui-layer input, 
    #ui-layer button {
      pointer-events: auto;
    }

    /* --- BASE PANEL IMAGE CARRIER --- */
    .img-panel {
      position: absolute;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      color: #ffffff;
      padding: 20px;
      filter: drop-shadow(0px 8px 16px rgba(0, 0, 0, 0.5));
    }

    /* --- CONTROLS PANEL --- */
    #controls-box {
      top: 20px;
      left: 20px;
      width: 280px;
      height: 200px;
      background-image: url('controls.png');
      padding-top: 55px; /* Offset text to clear the panel header graphic */
      padding-left: 25px;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    kbd {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      padding: 2px 6px;
      font-family: monospace;
      font-size: 11px;
      color: #ffffff;
      min-width: 24px;
      text-align: center;
    }

    /* --- CHAT PANEL --- */
    #chat-container {
      bottom: 20px;
      left: 20px;
      width: 480px;
      height: 220px;
      background-image: url('chat.png');
      padding-top: 55px;
      padding-left: 25px;
      padding-right: 25px;
      padding-bottom: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    #chat-messages {
      height: 110px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: 6px;
    }

    .chat-msg {
      font-size: 13px;
      color: #ffffff;
      word-wrap: break-word;
    }

    .chat-msg .username {
      font-weight: bold;
      color: #00d4ff;
    }

    #chat-input {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 212, 255, 0.4);
      border-radius: 4px;
      padding: 6px 10px;
      color: #ffffff;
      font-size: 12px;
      outline: none;
      width: 100%;
    }

    #chat-input:focus {
      border-color: #00d4ff;
    }

    /* --- LEADERBOARD PANEL --- */
    #leaderboard-box {
      top: 20px;
      right: 20px;
      width: 260px;
      height: 240px;
      background-image: url('leaderboard.png');
      padding-top: 55px;
      padding-left: 25px;
      padding-right: 25px;
    }

    .lb-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .lb-row.me {
      color: #00ff88;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div id="ui-layer">
    
    <div id="controls-box" class="img-panel">
    </div>

    <div id="chat-container" class="img-panel">
      <div id="chat-messages"></div>
      <input type="text" id="chat-input" placeholder="Type a message..." maxlength="80">
    </div>

    <div id="leaderboard-box" class="img-panel">
      <div id="leaderboard-list"></div>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="scripts.js"></script>
</body>
</html>
