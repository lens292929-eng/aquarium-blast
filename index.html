<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aquarium Blast</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020912;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Main Canvas */
    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }

    /* --- DESKTOP HUD PANELS --- */

    /* Desktop Controls Box */
    #controls-box {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 260px;
      height: 180px;
      background-image: url('controls.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: top left;
      pointer-events: none;
    }

    /* Leaderboard Box */
    #leaderboard-box {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 240px;
      height: 220px;
      background: rgba(0, 15, 30, 0.7);
      border: 1px solid rgba(0, 210, 255, 0.4);
      border-radius: 8px;
      padding: 15px;
      pointer-events: none;
    }

    #leaderboard-title {
      font-weight: bold;
      font-size: 14px;
      color: #00d2ff;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 150px;
      overflow: hidden;
    }

    .lb-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      padding: 3px 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .lb-row.me {
      color: #00ff88;
      background: rgba(0, 255, 136, 0.15);
      border-radius: 4px;
    }

    /* Chat Box */
    #chat-box {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 300px;
      height: 200px;
      background: rgba(0, 15, 30, 0.75);
      border: 1px solid rgba(0, 210, 255, 0.4);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      z-index: 5;
    }

    #chat-messages {
      flex-grow: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      color: #ffffff;
      margin-bottom: 8px;
      word-break: break-word;
    }

    #chat-messages::-webkit-scrollbar {
      width: 4px;
    }
    #chat-messages::-webkit-scrollbar-thumb {
      background: rgba(0, 210, 255, 0.5);
      border-radius: 2px;
    }

    .chat-msg .username {
      font-weight: bold;
      color: #00d2ff;
      margin-right: 4px;
    }

    #chat-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 210, 255, 0.4);
      border-radius: 4px;
      color: #ffffff;
      padding: 6px 10px;
      font-size: 12px;
      outline: none;
    }

    #chat-input:focus {
      border-color: #00d2ff;
      box-shadow: 0 0 5px rgba(0, 210, 255, 0.5);
    }

    /* --- MOBILE OVERLAY (JOYSTICK & TOUCH BUTTONS) --- */
    #mobile-controls {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
    }

    #joystick-zone {
      position: absolute;
      bottom: 30px;
      left: 30px;
      width: 120px;
      height: 120px;
      pointer-events: auto;
    }

    #joystick-base {
      width: 100%;
      height: 100%;
      background: rgba(0, 210, 255, 0.2);
      border: 2px solid rgba(0, 210, 255, 0.6);
      border-radius: 50%;
      position: relative;
      touch-action: none;
    }

    #joystick-stick {
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      position: absolute;
      top: 35px;
      left: 35px;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.8);
    }

    #action-buttons {
      position: absolute;
      bottom: 30px;
      right: 30px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: auto;
    }

    .button-row {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .touch-btn {
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.7);
      background: rgba(0, 150, 255, 0.45);
      color: white;
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    .touch-btn:active {
      transform: scale(0.92);
      background: rgba(0, 210, 255, 0.9);
    }

    .main-btn {
      width: 65px;
      height: 65px;
      font-size: 24px;
    }

    .alt-btn {
      width: 50px;
      height: 50px;
      font-size: 18px;
      background: rgba(0, 80, 180, 0.5);
    }

    .shoot-btn {
      background: rgba(255, 60, 60, 0.6);
      border-color: rgba(255, 120, 120, 0.9);
    }

    /* --- MOBILE SCREEN OVERRIDES --- */
    @media (hover: none) and (pointer: coarse) {
      /* Show touch overlay on mobile */
      #mobile-controls {
        display: block;
      }

      /* Hide big desktop controls PNG on mobile */
      #controls-box {
        display: none !important;
      }

      /* Make chat smaller and position above the joystick */
      #chat-box {
        width: 180px;
        height: 110px;
        bottom: 160px;
        left: 15px;
        padding: 8px;
      }

      #chat-messages {
        font-size: 10px;
      }

      #chat-input {
        padding: 4px 6px;
        font-size: 10px;
      }

      /* Scale down Leaderboard on mobile screens */
      #leaderboard-box {
        width: 160px;
        height: 140px;
        padding: 8px;
      }

      #leaderboard-title {
        font-size: 11px;
      }

      .lb-row {
        font-size: 10px;
      }
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div id="controls-box"></div>

  <div id="leaderboard-box">
    <div id="leaderboard-title">Leaderboard</div>
    <div id="leaderboard-list"></div>
  </div>

  <div id="chat-box">
    <div id="chat-messages"></div>
    <input type="text" id="chat-input" placeholder="Type..." maxlength="80" autocomplete="off" />
  </div>

  <div id="mobile-controls">
    <div id="joystick-zone">
      <div id="joystick-base">
        <div id="joystick-stick"></div>
      </div>
    </div>

    <div id="action-buttons">
      <div class="button-row">
        <button id="btn-eat" class="touch-btn alt-btn">🍽️</button>
        <button id="btn-throw" class="touch-btn alt-btn">🖐️</button>
      </div>
      <div class="button-row">
        <button id="btn-dash" class="touch-btn main-btn">⚡</button>
        <button id="btn-shoot" class="touch-btn main-btn shoot-btn">🔫</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="scripts.js"></script>

</body>
</html>
